name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Canonical job id `build`. Gate: format check (black), byte-compile of every module
  # (catches syntax/parse errors across src), and the pytest suite (tests/).
  build:
    name: lint + compile-check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Match the runtime the Docker image pins (python:3.14.6-slim).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting (Black)
        run: black --check src tests definitions.py

      - name: Compile-check (syntax of all modules)
        run: python -m compileall -q src definitions.py

      - name: Test (pytest)
        run: python -m pytest -q
