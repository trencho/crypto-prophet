name: CI

# No `paths:` filter for docs-only changes, on purpose: `build` is a required status check on
# master, and a path-filtered workflow never reports on a PR it skips, so a docs-only PR would wait
# for that check for ever.
on:
  push:
    branches: [master]
  pull_request:
  # The `auto-merge` job dispatches this workflow on master after a merge, because a merge made with
  # GITHUB_TOKEN raises no push event. Without this trigger that dispatch is an error, not a run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Canonical job id `build` (no `name:`, so the check-run is literally "build", which is the name
  # branch protection requires). The `auto-merge` job below lists it in `needs:`. Gate: black format
  # check, byte-compile of every module, pytest, and a container image build.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Match the runtime the Docker image pins (python:3.14.x-slim).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check formatting (Black)
        run: black --check src tests definitions.py main.py

      - name: Lint imports (Ruff)
        run: ruff check src tests definitions.py main.py

      - name: Compile-check (syntax of all modules)
        run: python -m compileall -q src definitions.py

      - name: Test (pytest)
        # Coverage is REPORTED, not gated. No --cov-fail-under yet: this repo has never had a
        # coverage number, so there is no measured baseline to ratchet against, and a threshold
        # picked from the first run is either trivially loose or fails CI on a figure nobody has
        # read. --cov=src scopes it to the application; tests and definitions.py are not subject.
        run: python -m pytest -q --cov=src --cov-report=term

      # The Dockerfile is the one artifact nothing above exercises. Every step here runs against
      # the checkout under the runner's own interpreter; none of them proves an image can be built
      # from it. A sibling repo shipped a Dockerfile that could not build at all for months -- its
      # base image had removed a flag the build depended on -- and no lint, compile-check or test
      # step could have seen it.
      #
      # No push and no registry login: this repo publishes no images. The step exists so a broken
      # Dockerfile fails on the PR that breaks it rather than the next time someone needs an image.
      # The context is the repo root, which is what `COPY . .` in the Dockerfile expects.
      # buildx, for the layer cache. The Dockerfile already mounts a pip cache
      # (`RUN --mount=type=cache,target=/root/.cache/pip`), but a cache MOUNT lives in the builder's
      # local state and every CI run gets a fresh builder -- so it was empty every time. Measured on
      # the 2026-09-06 run: setup-python restored a 587 MB pip cache and this step then re-downloaded
      # every wheel anyway, taking 53s. type=gha persists the LAYERS across runs, which is the part a
      # mount cannot do. It does not make an invalidated pip layer cheap; it makes an unchanged one free.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: crypto-prophet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Lands a Dependabot PR once every job in `needs:` passed. It replaced a separate workflow that
  # polled the check-runs API for named checks: a name that drifted from its job made that loop wait
  # for a check that never appeared, and every bot PR paid for the sleep. Here `needs:` is the gate,
  # so a renamed job breaks the YAML, a failed or skipped needed job skips the merge, and re-running
  # a failed job re-runs the merge with it.
  #
  # Every update type merges, majors included, so `needs:` must list every job that builds and
  # tests. A pre-release target and a workflow-modifying (github_actions) bump are held for a human.
  #
  # Gated on the PR's AUTHOR, not `github.actor`: the actor is whoever triggered this run, so a
  # human touching the branch (an "Update branch" click, a rebase) would turn the condition false.
  # A Dependabot-triggered run gets a read-only token unless the job asks for more, which is what
  # the job-level `permissions:` below does; no other job gets them.
  #
  # A merge made with GITHUB_TOKEN raises no workflow events, so nothing would run on the merged
  # head. The merge step therefore dispatches this workflow on the base branch afterwards.
  auto-merge:
    needs: [build]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # To dispatch this workflow on the base branch after the merge; see DISPATCH_WORKFLOW below.
      actions: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Pre-release guard: the one thing that does NOT auto-merge. Registries expose a release
      # channel, but the docker/docker-compose ecosystems match image TAGS, which carry none -- so
      # `python:3.14.6-slim` -> `python:3.15.0rc1-slim` scores an ordinary MINOR and would merge
      # into a production image (it did, 2026-08-15). It cannot be expressed in dependabot.yml:
      # ignore.versions takes version RANGES, not globs (dependabot-core#15154).
      #
      # `new-version` is empty on a GROUPED PR, so the raw metadata JSON is checked too: if any
      # updated dependency looks like a pre-release, the whole PR is held. Failing toward "hold"
      # is deliberate -- a missed merge is a nuisance, a shipped release candidate is an incident.
      - name: Check for a pre-release target
        id: prerelease
        env:
          NEW_VERSION: ${{ steps.meta.outputs.new-version }}
          UPDATED_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          # A token counts only where it is not buried inside a longer alphabetic word: `3.15.0rc1`
          # is held, while `26.7.0-alpine` and `1.31-alpine` are ordinary releases and pass. Longest
          # alternatives first so `preview` is reported as itself rather than as `pre`.
          pattern='(^|[^a-zA-Z])(preview|insiders|snapshot|nightly|canary|alpha|beta|next|dev|pre|rc)([^a-zA-Z]|$)'
          held=false
          offender=""
          if [ -n "${NEW_VERSION:-}" ] && printf '%s' "$NEW_VERSION" | grep -qiE "$pattern"; then
            held=true
            offender="$NEW_VERSION"
          fi
          if [ -n "${UPDATED_JSON:-}" ]; then
            # jq ships on GitHub-hosted runners. On a self-hosted one without it this holds every
            # PR, so say which of the two failures it is -- an unexplained fleet-wide freeze is
            # exactly how the 0.1.18 bug went unnoticed for a day.
            if ! command -v jq >/dev/null 2>&1; then
              held=true
              offender="jq unavailable - cannot inspect grouped metadata"
            elif versions=$(printf '%s' "$UPDATED_JSON" | jq -r '.[]?.newVersion // empty'); then
              hit=$(printf '%s\n' "$versions" | grep -iE "$pattern" | head -n 1 || true)
              if [ -n "$hit" ]; then
                held=true
                offender="$hit"
              fi
            else
              held=true
              offender="unparseable metadata"
            fi
          fi
          echo "held=$held" >> "$GITHUB_OUTPUT"
          echo "offender=$offender" >> "$GITHUB_OUTPUT"
          if [ "$held" = true ]; then
            echo "pre-release target detected ('$offender') - not auto-merging."
          fi

      - name: Explain a held pre-release
        if: ${{ steps.prerelease.outputs.held == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The offending VALUE, not `new-version` -- which is empty on exactly the
          # grouped PRs the metadata check exists to cover.
          OFFENDER: ${{ steps.prerelease.outputs.offender }}
        run: |
          gh pr comment "$PR_URL" --body "Held: this bump targets a **pre-release** version (\`$OFFENDER\`). Every other update type auto-merges; pre-releases need a human to confirm it is intended."

      # Actions bumps REWRITE A WORKFLOW FILE, and the workflows here can read the production
      # deploy secrets. SHA pinning is the control that makes a third-party action safe, and a
      # Dependabot bump rewrites the pin itself -- so auto-merging one accepts whatever SHA
      # upstream published, with no human in the loop.
      #
      # The VALUE is `github_actions`, with an UNDERSCORE. `dependabot.yml` spells the same
      # ecosystem `github-actions` with a hyphen, and a guard matching the hyphen holds nothing
      # while looking exactly like a working gate. Read off a real run's
      # `outputs.package-ecosystem:` log line, not assumed.
      - name: Hold a workflow-modifying bump for a human
        id: workflow_hold
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          held=false
          if [ "${ECOSYSTEM:-}" = "github_actions" ]; then
            held=true
          fi
          echo "held=$held" >> "$GITHUB_OUTPUT"
          if [ "$held" = true ]; then
            echo "github_actions bump - a workflow change needs a human, not auto-merging."
          fi

      # Said on the PR, not only in the log. A hold nobody is told about is indistinguishable from
      # a gate that silently stopped working.
      - name: Explain a held workflow bump
        if: ${{ steps.workflow_hold.outputs.held == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Held: this bump modifies a **workflow file**, and the workflows here can read the production deploy secrets. SHA pinning is what makes a third-party action safe, and this bump rewrites the pin itself, so merging it accepts whatever SHA upstream published. Review the diff and merge manually."

      - name: Merge, then dispatch CI on the base branch
        if: ${{ steps.prerelease.outputs.held == 'false' && steps.workflow_hold.outputs.held == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh workflow run` takes its repository from GH_REPO or the git remote, and this job has
          # no checkout. Without this line the dispatch fails with "not a git repository", which is
          # how an earlier version of this step failed on every bot merge without anyone noticing.
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The head commit the needed jobs tested. `--match-head-commit` refuses the merge if the
          # branch has moved since; the newer push has its own CI run, and that run decides.
          SHA: ${{ github.event.pull_request.head.sha }}
          # The workflow to dispatch after the merge: THIS file, so the merged head is built and
          # tested, and whatever chains off CI can run. Name the file this job lives in. Where the
          # deploy listens on `push` rather than on `workflow_run`, name the deploy workflow
          # instead, because the push it waits for is the one that never comes. It must declare
          # `workflow_dispatch:`. Set to empty to opt out.
          DISPATCH_WORKFLOW: ci.yml
          DISPATCH_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # If the branch is BEHIND, ask Dependabot to rebase and stop. GitHub reports BEHIND only
          # where the branch has `strict` required checks, so elsewhere this is a no-op.
          #
          # Ask DEPENDABOT to update the branch; do NOT use `gh pr update-branch` here. A branch
          # updated with GITHUB_TOKEN gets no CI run (GitHub raises no workflow events for its own
          # token), so its new head could never satisfy this job's `needs:`. Dependabot's own push
          # does trigger CI, and that run reaches this job again.
          state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" = "BEHIND" ]; then
            gh pr comment "$PR_URL" --body '@dependabot rebase'
            echo "branch is behind the base; asked Dependabot to rebase. Its CI run will merge it."
            exit 0
          fi

          if gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$SHA"; then
            if [ -n "${DISPATCH_WORKFLOW:-}" ]; then
              if gh workflow run "$DISPATCH_WORKFLOW" --ref "$DISPATCH_REF"; then
                echo "merged, and dispatched $DISPATCH_WORKFLOW on $DISPATCH_REF so the change ships."
              else
                # A failed dispatch FAILS this job. The merge has landed and a re-run cannot undo
                # it, but a warning on a green job is read by nobody; an earlier version did that
                # and failed on every bot merge for a week. A red check on the merged PR is what
                # someone sees. Recover by dispatching it by hand.
                echo "::error::merged, but could not dispatch $DISPATCH_WORKFLOW on $DISPATCH_REF. This change will NOT ship until something runs CI on $DISPATCH_REF: gh workflow run $DISPATCH_WORKFLOW --ref $DISPATCH_REF"
                exit 1
              fi
            fi
            exit 0
          fi

          # A sibling PR landing while this run was testing can leave the branch behind. Hand it back
          # to Dependabot rather than failing, for the reason given above.
          state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" = "BEHIND" ]; then
            gh pr comment "$PR_URL" --body '@dependabot rebase'
            echo "merge refused: branch fell behind; asked Dependabot to rebase."
            exit 0
          fi
          # Any other refusal is real and stays loud. Seen in the wild: GitHub blocks a GITHUB_TOKEN
          # merge of a PR that edits a workflow file, and `--match-head-commit` refuses a branch that
          # moved after the needed jobs tested it.
          echo "::error::merge refused while mergeStateStatus=$state."
          exit 1
