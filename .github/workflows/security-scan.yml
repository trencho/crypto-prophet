name: Security scan

# Weekly OSV vulnerability scan of the dependency tree, deliberately decoupled from the CI gate: a
# newly-published advisory surfaces as a scheduled red (and notifies the owner) without ever blocking
# a PR. Uses the plain OSV-Scanner action (no SARIF upload), so no GitHub Advanced Security is needed;
# the job fails if OSV finds a known vulnerability.
#
# Scans the fully-pinned LOCK, not the direct-only requirements.txt: a direct-only file leaves
# transitives unpinned, so OSV would resolve them to their oldest-compatible versions and report false
# positives. `.lock` isn't an OSV-recognized name, so force the pip parser with `<parse-as>:<path>`.
# Regenerate requirements.lock when requirements.txt changes.
on:
  schedule:
    - cron: "33 7 * * 1" # weekly, Monday 07:33 UTC - fleet slot (minutes staggered per repo)
  # No `push` trigger, deliberately. A push to master is a squash of the tree the `pull_request`
  # run checked minutes earlier, so it re-answered a question already answered. This repo is
  # public and Actions minutes are unlimited here, so the reason is redundancy rather than cost --
  # the same change on the two private repos was made to stop the account's free minutes running
  # out, and this one keeps the fleet's scans on one shape.
  #
  # The two triggers that remain each cover something nothing else does: `pull_request` catches a
  # dependency arriving with a known advisory BEFORE it lands; `schedule` catches a dependency
  # already here that became vulnerable, which no code-change trigger can see.
  #
  # The gap this accepts, named rather than left to be discovered: a dependency change pushed
  # DIRECTLY to master, bypassing a PR, is unscanned until the weekly run. Dependencies here arrive
  # through Dependabot PRs, and Dependabot's own alerts cover that case independently.
  #
  # NOT done in trencho.github.io, on purpose: that scan uploads SARIF to the Security tab, so its
  # push run is what refreshes -- and CLOSES -- default-branch code-scanning alerts. This scan
  # uploads nothing, so dropping push costs it no signal.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          # --no-resolve: the lock is already fully pinned, so read exactly those versions and skip
          # OSV's transitive-dependency resolver (which is redundant here and errors "resolution
          # impossible" on this dep set -> exit 127, even though the pinned scan finds 0 vulns).
          scan-args: |-
            --no-resolve
            -L
            requirements.txt:requirements.lock
