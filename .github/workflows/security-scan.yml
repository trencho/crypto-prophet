name: Security scan

# Weekly OSV vulnerability scan of the dependency tree, deliberately decoupled from the CI gate: a
# newly-published advisory surfaces as a scheduled red (and notifies the owner) without ever blocking
# a PR. Uses the plain OSV-Scanner action (no SARIF upload), so no GitHub Advanced Security is needed;
# the job fails if OSV finds a known vulnerability.
#
# Scans a fully-pinned tree, not the direct-only requirements.txt: a direct-only file leaves
# transitives unpinned, so OSV would resolve them to their oldest-compatible versions and report false
# positives. The job compiles that tree itself rather than reading a committed lock; the step below
# says why.
on:
  schedule:
    - cron: "33 7 * * 1" # weekly, Monday 07:33 UTC - fleet slot (minutes staggered per repo)
  # No `push` trigger, deliberately. A push to master is a squash of the tree the `pull_request`
  # run checked minutes earlier, so it re-answered a question already answered. This repo is
  # public and Actions minutes are unlimited here, so the reason is redundancy rather than cost --
  # the same change on the two private repos was made to stop the account's free minutes running
  # out, and this one keeps the fleet's scans on one shape.
  #
  # The two triggers that remain each cover something nothing else does: `pull_request` catches a
  # dependency arriving with a known advisory BEFORE it lands; `schedule` catches a dependency
  # already here that became vulnerable, which no code-change trigger can see.
  #
  # The gap this accepts, named rather than left to be discovered: a dependency change pushed
  # DIRECTLY to master, bypassing a PR, is unscanned until the weekly run. Dependencies here arrive
  # through Dependabot PRs, and Dependabot's own alerts cover that case independently.
  #
  # NOT done in trencho.github.io, on purpose: that scan uploads SARIF to the Security tab, so its
  # push run is what refreshes -- and CLOSES -- default-branch code-scanning alerts. This scan
  # uploads nothing, so dropping push costs it no signal.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exact pin, unlike the major-tag pins elsewhere in this repo: astral-sh publishes floating
      # major tags only up to v7 while the current release is v10.1.0, so `@v10` does not resolve.
      # Same style as the osv-scanner pin below. Dependabot's github-actions ecosystem keeps it current.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Compile the dependency tree
        # WHY THIS IS COMPILED HERE AND NOT COMMITTED.
        #
        # The tree used to be requirements.lock, regenerated by hand, which made it a derived file
        # only a human could refresh. That failed in both directions:
        #
        #   On a PR. Dependabot bumps the manifests and cannot run `uv pip compile`, so every pip PR
        #   arrived carrying a lock without the version it proposed. The `pull_request` trigger exists
        #   to catch an advisory BEFORE it lands, and on the only PRs that introduce new versions it
        #   was reading the tree being replaced. The same drift failed ci.yml's lock-agreement guard
        #   by construction, so no pip PR could go green without a human regenerating first.
        #
        #   On master. Measured 2026-09-16 with the manifests unchanged: threadpoolctl had moved
        #   3.6.0 -> 3.7.0 since the last hand-regeneration. The guard could not see it, because it
        #   compared the DECLARED pins and the transitives are the whole reason the file exists.
        #   The sibling repos measured eight and nine, so one here is luck rather than design.
        #
        #   On the wrong platform, which is the worst of the three. The lock was last compiled on
        #   Windows. Measured against the first ubuntu compile: it carried `colorama` and `tzdata`,
        #   which no runner installs, and it was MISSING `nvidia-nccl-cu13`, which xgboost pulls on
        #   Linux and which requirements.txt therefore ships into the production image. OSV had
        #   never seen that package at all. A phantom entry costs a false positive; an absent one
        #   means a real shipped dependency was never scanned.
        #
        # All three shapes hide an advisory rather than invent one, which is the direction that costs
        # something. Compiling in the job, on the platform that runs the code, makes all three
        # unrepresentable.
        #
        # BOTH manifests, because the scanned tree has always covered both: checking only the runtime
        # one would leave the dev tree unscanned. --python-version pins resolution to the version CI
        # runs, so the markers match the tree that actually installs. It is also the line the
        # `lift-when` hold in dependabot.yml now names for the 3.15 move.
        run: |
          uv pip compile requirements.txt requirements-dev.txt \
            --python-version 3.14 --strip-extras --no-header -q -o requirements.lock
          echo "tree: $(grep -c '^[A-Za-z]' requirements.lock) packages"

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          # `.lock` isn't an OSV-recognized name, so force the pip parser with `<parse-as>:<path>`.
          # --no-resolve: the tree is already fully pinned, so read exactly those versions and skip
          # OSV's transitive-dependency resolver (which is redundant here and errors "resolution
          # impossible" on this dep set -> exit 127, even though the pinned scan finds 0 vulns).
          scan-args: |-
            --no-resolve
            -L
            requirements.txt:requirements.lock

      - name: Keep the tree this run scanned
        # Replaces what the committed lock used to provide, and records it better than it did:
        # dated, tied to one run, and unable to disagree with what OSV actually read. Kept on failure
        # too, which is when knowing the exact versions matters most.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-tree-${{ github.run_id }}
          path: requirements.lock
          retention-days: 90
