# Dependabot version updates. Grouping minor+patch keeps majors in their own PR (excluded from
# auto-merge). Dependabot updates requirements.txt (the install source of truth); it does NOT know
# about requirements.lock, so regenerate the lock (uv pip compile / pip-compile) when a bump lands
# — the OSV security scan reads the lock.
version: 2
updates:
  # Python deps (requirements.txt at repo root).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions pins fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Skopje
    commit-message:
      prefix: ci

  # Dockerfile base image (docker/Dockerfile -> python:3.14.x-slim).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Skopje
    commit-message:
      prefix: chore
    # Patches within the pinned line still flow. What is held is the MINOR, because on this
    # ecosystem a Python minor is a runtime change that CI would not exercise.
    #
    # The pre-release guard in dependabot-auto-merge.yml already blocks `python:3.15.0rc1-slim`:
    # `docker` matches TAGS, which carry no release-channel metadata, so an RC scores as an ordinary
    # minor, and `ignore.versions` takes version RANGES rather than globs (dependabot-core#15154),
    # so "no pre-releases" cannot be written here at all.
    #
    # But a STABLE `python:3.15.0-slim` is not a pre-release, so nothing stopped it: it would have
    # auto-merged into the production image while ci.yml still installed 3.14 and the lock was still
    # compiled `--python-version 3.14`. That is exactly how a sibling repo shipped a non-LTS Node to
    # production on 2026-08-16 -- CI was green because CI tested a different runtime than the change
    # was about. Hold the line, and move all three together when the runtime moves.
    ignore:
      # lift-when: manual ci.yml python-version, the requirements lock and docker/Dockerfile all
      # move to 3.15 together; bump CI first and lift this once the suite is green on it.
      - dependency-name: "python"
        versions: [">=3.15"]

  # Compose files -- a SEPARATE ecosystem from `docker`, which does NOT cover them. Before this
  # block existed the image tags in /docker were updated by nothing at all, because
  # `docker` was configured and containers read as handled.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
