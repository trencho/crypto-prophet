# Dependabot version updates. Grouping minor+patch keeps majors in their own PR (excluded from
# auto-merge). Dependabot updates requirements.txt (the install source of truth); it does NOT know
# about requirements.lock, so regenerate the lock (uv pip compile / pip-compile) when a bump lands
# — the OSV security scan reads the lock.
version: 2
updates:
  # Python deps (requirements.txt at repo root).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions pins fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Skopje
    commit-message:
      prefix: ci

  # Dockerfile base image (docker/Dockerfile -> python:3.14.x-slim).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Skopje
    commit-message:
      prefix: chore
    # No update-type restriction: majors, minors and patches all flow, and the guard that matters
    # for images -- blocking a RELEASE-CANDIDATE tag -- lives in dependabot-auto-merge.yml instead.
    # It has to: `docker` matches TAGS, which carry no release-channel metadata, so
    # `python:3.14.6-slim` -> `python:3.15.0rc1-slim` scores an ordinary MINOR, and
    # `ignore.versions` takes version RANGES rather than globs (dependabot-core#15154), so
    # "no pre-releases" cannot be written here at all.

  # Compose files -- a SEPARATE ecosystem from `docker`, which does NOT cover them. Before this
  # block existed the image tags in /docker were updated by nothing at all, because
  # `docker` was configured and containers read as handled.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
