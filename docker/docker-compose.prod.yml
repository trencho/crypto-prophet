version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: gunicorn main:app --bind 0.0.0.0:5000 -w 4 -k uvicorn.workers.UvicornWorker
    expose:
      - 5000
    # /health exists and is mounted at import time so it answers during a slow startup, but
    # nothing consumed it. start_period covers the CoinGecko warm-up, which runs in the
    # background and can leave the data routes 500ing for its duration.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.fastapi.rule=Host(`subdomain.example.com`)'
      - 'traefik.http.routers.fastapi.tls=true'
      - 'traefik.http.routers.fastapi.tls.certresolver=letsencrypt'

  traefik:
    image: traefik:v3.7.13
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - '$PWD/docker/traefik.prod.yml:/etc/traefik/traefik.prod.yml'